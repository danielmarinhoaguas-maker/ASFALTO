<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mapa de Serviços — Repavimentação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--line:#dbe3ee;--text:#14213d;--dim:#5b6b86;--blue:#0027BD;--teal:#17E3CB;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);}
#app{display:flex;flex-direction:column;height:100vh;}
header{background:linear-gradient(90deg,#0b1f8f,#0027BD 55%,#17a9c4);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
header h1{font-size:16px;margin:0;font-weight:700;}
header .sub{font-size:11.5px;opacity:.85;}
#filters{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.f{display:flex;flex-direction:column;gap:4px;}
.f label{font-size:10.5px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.f select,.f input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;color:var(--text);min-width:130px;}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer;color:var(--dim);}
.seg button.on{background:var(--blue);color:#fff;font-weight:600;}
#main{flex:1;display:flex;min-height:0;}
#map{flex:1;}
#side{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
#kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line);}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px;}
.kpi b{display:block;font-size:20px;color:var(--blue);font-variant-numeric:tabular-nums;}
.kpi span{font-size:11px;color:var(--dim);}
#rankHead{padding:10px 12px 6px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
#rank{overflow-y:auto;flex:1;padding-bottom:8px;}
.ri{padding:7px 12px;cursor:pointer;}
.ri:hover{background:var(--bg);}
.ri .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
.ri .t b{font-weight:600;}
.bar{height:6px;background:#e6ecf5;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#17E3CB,#0027BD);}
.legend{background:#fff;padding:8px 10px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.25);font-size:11px;line-height:1.3;}
.legend .grad{height:9px;width:150px;border-radius:4px;background:linear-gradient(90deg,#d2f7f2,#17E3CB 35%,#0b5fd0 70%,#0027BD);margin:4px 0 2px;}
.legend .lb{display:flex;justify-content:space-between;color:var(--dim);}
.pp b{color:var(--blue);}
.pp table{border-collapse:collapse;margin-top:4px;font-size:12px;}
.pp td{padding:1px 8px 1px 0;}
@media(max-width:800px){#main{flex-direction:column;}#side{width:100%;height:42%;border-left:0;border-top:1px solid var(--line);}#map{min-height:50%;}}
</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>Mapa de Serviços — Repavimentação</h1><div class="sub">Manaus/AM · exemplo no estilo "mapa eleitoral" · cada bolha é um bairro</div></div>
  <div class="sub" id="periodo"></div>
</header>
<div id="filters">
  <div class="f"><label>Tipo de serviço</label><select id="fTipo"></select></div>
  <div class="f"><label>Status</label><select id="fStatus"><option value="all">Todos</option><option value="1">Finalizada</option><option value="0">Encerrada com ocorrência</option></select></div>
  <div class="f"><label>De</label><input type="date" id="fDe"></div>
  <div class="f"><label>Até</label><input type="date" id="fAte"></div>
  <div class="f"><label>Colorir por</label><div class="seg" id="fMetric"><button data-m="qtd" class="on">Quantidade</button><button data-m="pct">% finalizados</button></div></div>
  <div class="f"><label>Visualização</label><div class="seg" id="fView"><button data-v="bolhas" class="on">Bairros</button><button data-v="pontos">Pontos</button></div></div>
</div>
<div id="main">
  <div id="map"></div>
  <div id="side">
    <div id="kpis">
      <div class="kpi"><b id="kTotal">0</b><span>serviços</span></div>
      <div class="kpi"><b id="kPct">0%</b><span>finalizados</span></div>
      <div class="kpi"><b id="kBairros">0</b><span>bairros atendidos</span></div>
      <div class="kpi"><b id="kTop">–</b><span>bairro líder</span></div>
    </div>
    <div id="rankHead">Ranking de bairros</div>
    <div id="rank"></div>
  </div>
</div>
</div>

const ROWS = DATA.rows, TIPOS = DATA.tipos;
const R = {lat:0,lng:1,bairro:2,fin:3,tipo:4,data:5,prot:6,end:7};

// centroide estável por bairro (usa todos os pontos)
const cent = {};
ROWS.forEach(r=>{const c=cent[r[R.bairro]]||(cent[r[R.bairro]]={la:0,ln:0,n:0});c.la+=r[R.lat];c.ln+=r[R.lng];c.n++;});
Object.values(cent).forEach(c=>{c.la/=c.n;c.ln/=c.n;});

const dates = ROWS.map(r=>r[R.data]).sort();
const minD = dates[0], maxD = dates[dates.length-1];
const el = id=>document.getElementById(id);
el('fDe').value=minD; el('fDe').min=minD; el('fDe').max=maxD;
el('fAte').value=maxD; el('fAte').min=minD; el('fAte').max=maxD;
el('fTipo').innerHTML = '<option value="all">Todos</option>'+TIPOS.map((t,i)=>`<option value="${i}">${t}</option>`).join('');

const map = L.map('map').setView([-3.06,-60.0],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19}).addTo(map);
map.attributionControl.setPrefix('');
const layer = L.layerGroup().addTo(map);

let metric='qtd', view='bolhas';

function lerp(a,b,t){return a+(b-a)*t;}
const STOPS=[[210,247,242],[23,227,203],[11,95,208],[0,39,189]];
function color(t){
  t=Math.max(0,Math.min(1,t));
  const s=t*(STOPS.length-1), i=Math.min(Math.floor(s),STOPS.length-2), f=s-i;
  const a=STOPS[i],b=STOPS[i+1];
  return `rgb(${Math.round(lerp(a[0],b[0],f))},${Math.round(lerp(a[1],b[1],f))},${Math.round(lerp(a[2],b[2],f))})`;
}

function filtered(){
  const t=el('fTipo').value, s=el('fStatus').value, de=el('fDe').value, ate=el('fAte').value;
  return ROWS.filter(r=>(t==='all'||r[R.tipo]==t)&&(s==='all'||r[R.fin]==s)&&r[R.data]>=de&&r[R.data]<=ate);
}
const fmtD=d=>d.split('-').reverse().join('/');

function render(){
  const rows=filtered();
  layer.clearLayers();
  // agrega por bairro
  const agg={};
  rows.forEach(r=>{const a=agg[r[R.bairro]]||(agg[r[R.bairro]]={n:0,f:0,tipos:{}});a.n++;a.f+=r[R.fin];a.tipos[r[R.tipo]]=(a.tipos[r[R.tipo]]||0)+1;});
  const list=Object.entries(agg).map(([b,a])=>({b,...a,pct:a.n?a.f/a.n:0}));
  const val=x=>metric==='qtd'?x.n:x.pct;
  const maxV=Math.max(1,...list.map(val));
  const maxN=Math.max(1,...list.map(x=>x.n));

  if(view==='bolhas'){
    list.sort((a,b)=>a.n-b.n).forEach(x=>{
      const c=cent[x.b];
      const t=metric==='qtd'?Math.sqrt(x.n/maxN):x.pct;
      const rad=6+Math.sqrt(x.n/maxN)*26;
      const rows2=Object.entries(x.tipos).sort((a,b)=>b[1]-a[1]).map(([i,n])=>`<tr><td>${TIPOS[i]}</td><td><b>${n}</b></td></tr>`).join('');
      L.circleMarker([c.la,c.ln],{radius:rad,fillColor:color(t),fillOpacity:.82,color:'#fff',weight:1.5})
        .bindPopup(`<div class="pp"><b>${x.b}</b><br>${x.n} serviços · ${Math.round(x.pct*100)}% finalizados<table>${rows2}</table></div>`)
        .bindTooltip(`${x.b}: ${x.n}`).addTo(layer);
    });
  } else {
    rows.forEach(r=>{
      L.circleMarker([r[R.lat],r[R.lng]],{radius:5,fillColor:r[R.fin]?'#0b9d6b':'#e0a800',fillOpacity:.85,color:'#fff',weight:1})
        .bindPopup(`<div class="pp"><b>${r[R.prot]}</b><br>${r[R.end]}<br>${r[R.bairro]} · ${TIPOS[r[R.tipo]]}<br>${r[R.fin]?'Finalizada':'Encerrada c/ ocorrência'} · ${fmtD(r[R.data])}</div>`).addTo(layer);
    });
  }

  // KPIs
  const tot=rows.length, fin=rows.reduce((s,r)=>s+r[R.fin],0);
  list.sort((a,b)=>val(b)-val(a)||b.n-a.n);
  el('kTotal').textContent=tot.toLocaleString('pt-BR');
  el('kPct').textContent=tot?Math.round(fin/tot*100)+'%':'–';
  el('kBairros').textContent=list.length;
  el('kTop').textContent=list.length?list[0].b:'–';
  el('periodo').textContent=`${fmtD(el('fDe').value)} a ${fmtD(el('fAte').value)}`;
  el('rankHead').textContent=metric==='qtd'?'Ranking — quantidade de serviços':'Ranking — % finalizados';

  // ranking
  el('rank').innerHTML=list.slice(0,40).map(x=>`<div class="ri" data-b="${x.b}"><div class="t"><b>${x.b}</b><span>${metric==='qtd'?x.n:Math.round(x.pct*100)+'%'} <small style="color:#8a97ad">(${x.n})</small></span></div><div class="bar"><i style="width:${val(x)/maxV*100}%"></i></div></div>`).join('')||'<div style="padding:16px;color:#5b6b86;font-size:13px">Nenhum serviço com esses filtros.</div>';
  document.querySelectorAll('.ri').forEach(d=>d.onclick=()=>{const c=cent[d.dataset.b];map.flyTo([c.la,c.ln],14,{duration:.7});});
}

// legenda
const lg=L.control({position:'bottomleft'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.id='legend';return d;};
lg.addTo(map);
function updLegend(){
  el('legend').innerHTML = view==='bolhas'
   ? `<b>${metric==='qtd'?'Nº de serviços':'% finalizados'}</b><div class="grad"></div><div class="lb"><span>${metric==='qtd'?'menos':'0%'}</span><span>${metric==='qtd'?'mais':'100%'}</span></div><div style="color:#5b6b86">Tamanho da bolha = nº de serviços</div>`
   : `<b>Pontos</b><br><span style="color:#0b9d6b">●</span> Finalizada &nbsp; <span style="color:#e0a800">●</span> Encerrada c/ ocorrência`;
}

['fTipo','fStatus','fDe','fAte'].forEach(id=>el(id).addEventListener('change',()=>{render();}));
document.querySelectorAll('#fMetric button').forEach(b=>b.onclick=()=>{metric=b.dataset.m;document.querySelectorAll('#fMetric button').forEach(x=>x.classList.toggle('on',x===b));updLegend();render();});
document.querySelectorAll('#fView button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('#fView button').forEach(x=>x.classList.toggle('on',x===b));updLegend();render();});
updLegend(); render();
</script>
